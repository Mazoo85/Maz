<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0818" />
  <title>MANDALA MAKER — Draw a Mandala</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d0818'/><circle cx='8' cy='8' r='6' fill='none' stroke='%23b06bff' stroke-width='1.2'/><circle cx='8' cy='8' r='2' fill='%23ffcf4d'/><path d='M8 2v12M2 8h12' stroke='%2300e5ff' stroke-width='.8'/></svg>" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✺</span>
        <h1>MANDALA <span class="brand-alt">MAKER</span></h1>
      </div>
      <p class="tagline">Draw one line — it repeats all the way round. Or press <strong>Surprise me</strong> and get a whole mandala.</p>
    </header>

    <main class="layout">
      <section class="stage" aria-label="Drawing area">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas" aria-label="Mandala canvas. Drag to draw; every line is repeated round the centre."></canvas>
          <p class="hint" id="hint">Drag anywhere to draw ✍️</p>
        </div>
        <div class="actions">
          <button id="surprise" class="primary" title="Make a random mandala">✨ Surprise me</button>
          <button id="undo" title="Undo the last line (Ctrl+Z)">↩ Undo</button>
          <button id="clear" title="Start again with a blank page">🗑 Clear</button>
          <button id="savePng" class="accent" title="Download a picture of your mandala">⬇ Save picture</button>
        </div>
      </section>

      <aside class="panel" aria-label="Brush settings">
        <div class="control">
          <label for="slices">Repeats <output id="slicesOut">8</output></label>
          <input type="range" id="slices" min="2" max="32" step="1" value="8" />
        </div>

        <div class="control">
          <label for="size">Brush size <output id="sizeOut">4</output></label>
          <input type="range" id="size" min="1" max="30" step="1" value="4" />
        </div>

        <div class="control">
          <span class="label">Colour</span>
          <div class="swatches" id="swatches" role="radiogroup" aria-label="Brush colour"></div>
        </div>

        <div class="control">
          <label for="palette">Colour set</label>
          <select id="palette"></select>
        </div>

        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="mirror" checked /> <span>🪞 Mirror</span></label>
          <label class="toggle"><input type="checkbox" id="glow" /> <span>💡 Glow</span></label>
          <label class="toggle"><input type="checkbox" id="guides" checked /> <span>📐 Guide lines</span></label>
          <label class="toggle"><input type="checkbox" id="spin" /> <span>🌀 Spin</span></label>
        </div>

        <p class="note">Your drawing is kept in this browser, so it is still here next time. Guide lines are never in the saved picture.</p>
      </aside>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/mandala.js"></script>
  <script src="js/app.js"></script>

<!-- shared MAZ ARCADE nav: back to the hub + jump to any other project -->
<script src="../shared/maz-nav.js" data-current="mandala" defer></script>
</body>
</html>
