<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZOMBOID: ANCHORAGE — 16-bit Neon Survival Horror</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ff2d95'/><rect x='4' y='4' width='3' height='3' fill='%2339ff14'/><rect x='9' y='4' width='3' height='3' fill='%2339ff14'/></svg>" />
</head>
<body>
  <div id="frame">
    <canvas id="game"></canvas>
    <div id="loading">BOOTING NEON GENESIS ARCADE...</div>
  </div>

  <!-- engine -->
  <script src="../shared/maz-util.js"></script>
  <script src="js/world.js"></script>
  <script src="js/worldgen.js"></script>
  <script src="js/items.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script>
    // hide the loading splash once the first frame paints
    window.addEventListener('load', () => {
      const l = document.getElementById('loading');
      setTimeout(() => { if (l) l.style.display = 'none'; }, 300);
    });
  </script>

<!-- shared MAZ ARCADE nav: back to the hub + jump to any other project -->
<script src="../shared/maz-nav.js" data-current="zomboid" data-mode="overlay" defer></script>
</body>
</html>
