[project]
name = "maz-crew"
version = "0.1.0"
description = "A personal CLI that orchestrates a team of AI coding agents (planner, coder, reviewer, tester) on the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crew = "crew.cli:app"

[tool.pytest.ini_options]
# Put the project root and the tests dir on the path so `pytest` works without
# installing the package (tests import both `crew.*` and the shared `conftest`).
pythonpath = [".", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crew"]
