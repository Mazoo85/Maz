<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#241858"/>
      <stop offset="55%" stop-color="#160f2e"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- diamond accent -->
  <g filter="url(#glow)">
    <path d="M256 74 l150 150 -150 150 -150 -150 z" fill="none" stroke="#39ff14"
          stroke-width="10" opacity="0.28"/>
  </g>

  <!-- three "fill-in-the-blank" lines with word blocks (madlibs motif) -->
  <g filter="url(#glow)">
    <!-- line 1 (cyan) -->
    <rect x="120" y="188" width="96" height="34" rx="8" fill="#00e5ff"/>
    <rect x="232" y="205" width="160" height="9" rx="4.5" fill="#00e5ff" opacity="0.85"/>
    <!-- line 2 (pink) -->
    <rect x="120" y="250" width="150" height="34" rx="8" fill="#ff2d95"/>
    <rect x="286" y="267" width="106" height="9" rx="4.5" fill="#ff2d95" opacity="0.85"/>
    <!-- line 3 (green) -->
    <rect x="120" y="312" width="70" height="34" rx="8" fill="#39ff14"/>
    <rect x="206" y="329" width="186" height="9" rx="4.5" fill="#39ff14" opacity="0.85"/>
  </g>
</svg>
