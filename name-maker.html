<title>Name Maker</title>

<style>
  :root {
    --paper: #f2efe9;
    --panel: #ffffff;
    --ink: #1b1a22;
    --ink-soft: #5c5a67;
    --line: #e2ded5;
    --accent: #ff4d2e;
    --accent-ink: #ffffff;
    --readout-bg: #14131a;
    --readout-ink: #ffd9cd;
    --readout-glow: #ff6a4d;
    --shadow: 0 18px 44px rgba(24, 20, 18, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131218;
      --panel: #1e1d26;
      --ink: #f3f1ec;
      --ink-soft: #a8a5b2;
      --line: #2e2c38;
      --accent: #ff5a3c;
      --accent-ink: #14100e;
      --readout-bg: #0c0b11;
      --readout-ink: #ffd9cd;
      --readout-glow: #ff6a4d;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="light"] {
    --paper: #f2efe9; --panel: #ffffff; --ink: #1b1a22; --ink-soft: #5c5a67;
    --line: #e2ded5; --accent: #ff4d2e; --accent-ink: #ffffff;
    --readout-bg: #14131a; --readout-ink: #ffd9cd; --readout-glow: #ff6a4d;
    --shadow: 0 18px 44px rgba(24, 20, 18, 0.16);
  }
  :root[data-theme="dark"] {
    --paper: #131218; --panel: #1e1d26; --ink: #f3f1ec; --ink-soft: #a8a5b2;
    --line: #2e2c38; --accent: #ff5a3c; --accent-ink: #14100e;
    --readout-bg: #0c0b11; --readout-ink: #ffd9cd; --readout-glow: #ff6a4d;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1rem, 4vw, 3rem);
    background:
      radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--accent) 8%, var(--paper)), var(--paper));
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .machine {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: clamp(1.5rem, 5vw, 2.5rem);
    box-shadow: var(--shadow);
  }

  .eyebrow {
    margin: 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0.35rem 0 0.2rem;
    font-size: clamp(1.9rem, 6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }

  .lede {
    margin: 0 0 1.5rem;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  .readout {
    background: var(--readout-bg);
    border-radius: 14px;
    padding: 1.6rem 1.25rem;
    text-align: center;
    overflow: hidden;
  }

  .readout .name {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: clamp(1.5rem, 6.5vw, 2.15rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--readout-ink);
    text-shadow: 0 0 22px color-mix(in srgb, var(--readout-glow) 55%, transparent);
    line-height: 1.15;
    word-break: break-word;
    min-height: 1.2em;
  }

  .readout .hint {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.95rem;
    color: color-mix(in srgb, var(--readout-ink) 55%, transparent);
    letter-spacing: 0.02em;
  }

  .rolling { opacity: 0.75; }

  button.make {
    appearance: none;
    border: none;
    cursor: pointer;
    width: 100%;
    margin-top: 1rem;
    padding: 1.05rem 1rem;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 14px;
    box-shadow: 0 8px 0 color-mix(in srgb, var(--accent) 55%, #000);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
  }
  button.make:hover { filter: brightness(1.04); }
  button.make:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 55%, #000);
  }
  button.make:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 60%, var(--ink));
    outline-offset: 3px;
  }

  .recent {
    margin-top: 1.75rem;
    border-top: 1px solid var(--line);
    padding-top: 1.1rem;
  }
  .recent h2 {
    margin: 0 0 0.7rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .recent ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .recent li {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.95rem;
    color: var(--ink-soft);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .recent li .num {
    font-size: 0.72rem;
    color: color-mix(in srgb, var(--ink-soft) 60%, transparent);
    font-variant-numeric: tabular-nums;
  }
  .recent .empty { color: color-mix(in srgb, var(--ink-soft) 70%, transparent); font-style: italic; }

  .foot {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    button.make, .rolling { transition: none; }
  }
</style>

<main class="machine">
  <p class="eyebrow">Random Name Maker</p>
  <h1>Make a name</h1>
  <p class="lede">One random describing word, one random thing. Press the button.</p>

  <div class="readout">
    <div id="name" class="name hint">press the button &rarr;</div>
  </div>

  <button id="make" class="make" type="button">Make a name</button>

  <section class="recent">
    <h2>Recent names</h2>
    <ul id="recent"><li class="empty">Your names will show up here.</li></ul>
  </section>

  <p class="foot">Choosing from 1000 adjectives &times; 1000 nouns &mdash; a million possible names.</p>
</main>

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
function makeName() { return cap(pick(ADJECTIVES)) + " " + cap(pick(NOUNS)); }

const nameEl = document.getElementById("name");
const btn = document.getElementById("make");
const recentEl = document.getElementById("recent");
const history = [];
let rolling = false;

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function show(name) {
  nameEl.textContent = name;
  nameEl.classList.remove("hint");
}

function commit(name) {
  show(name);
  history.unshift(name);
  if (history.length > 5) history.pop();
  recentEl.innerHTML = "";
  history.forEach((n, i) => {
    const li = document.createElement("li");
    const label = document.createElement("span");
    label.textContent = n;
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = "#" + (history.length - i);
    li.appendChild(label);
    li.appendChild(num);
    recentEl.appendChild(li);
  });
}

function run() {
  if (rolling) return;
  const final = makeName();
  if (reduceMotion) { commit(final); return; }
  rolling = true;
  btn.disabled = true;
  nameEl.classList.add("rolling");
  let ticks = 0;
  const total = 11;
  const step = () => {
    ticks++;
    if (ticks >= total) {
      nameEl.classList.remove("rolling");
      commit(final);
      rolling = false;
      btn.disabled = false;
      return;
    }
    show(makeName());
    setTimeout(step, 40 + ticks * 12);
  };
  step();
}

btn.addEventListener("click", run);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") {
    if (document.activeElement !== btn) { e.preventDefault(); run(); }
  }
});
