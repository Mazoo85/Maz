name: Feature request
description: Suggest a new capability or improvement for the Maz engine.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or the pain point, not just the solution.
      placeholder: "There's no built-in way to load Ogg audio, so I have to convert everything to WAV first."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API, module, or behavior you'd like. A rough sketch is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why the proposal is better.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the engine does this touch?
      options:
        - Rendering
        - Audio
        - Physics
        - Animation
        - UI
        - Scripting
        - Asset import/export
        - Platform / build
        - Tooling / editor
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this.
