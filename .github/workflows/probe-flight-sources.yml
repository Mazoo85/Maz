name: Probe flight sources (temporary)

# One-off diagnostic for GOD'S EYE VIEW's PLANES layer: asks the planes relay
# for aircraft the way the page does, and checks it turns other sites away.
# Lives only on a throwaway branch.
on: push

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the relay as GOD'S EYE VIEW
        run: |
          R=https://godview-planes.cody-collins85-cc.workers.dev
          echo "=== as our site (New York)"
          curl -sS -m 30 -o body.json -D h.txt -H "Origin: https://mazoo85.github.io" "$R/planes?lat=40.6&lng=-73.8"
          head -1 h.txt; grep -i "^access-control-allow-origin" h.txt || echo "(no CORS header)"
          python3 -c "import json;d=json.load(open('body.json'));print('source:',d.get('source'),'aircraft:',len(d.get('ac') or []),'error:',d.get('error'),d.get('details'));a=(d.get('ac') or [{}])[0];print('first:',{k:a.get(k) for k in ['hex','flight','lat','lon','alt_baro','gs','track']})"
          echo "=== as our site (London)"
          curl -sS -m 30 -o body2.json -H "Origin: https://mazoo85.github.io" "$R/planes?lat=51.5&lng=-0.1"
          python3 -c "import json;d=json.load(open('body2.json'));print('source:',d.get('source'),'aircraft:',len(d.get('ac') or []),'error:',d.get('error'))"
          echo "=== preflight from our site"
          curl -sS -m 30 -o /dev/null -D - -X OPTIONS -H "Origin: https://mazoo85.github.io" -H "Access-Control-Request-Method: GET" "$R/planes?lat=1&lng=1" | grep -i -E "^HTTP|^access-control-allow-origin"
          echo "=== as some other site"
          curl -sS -m 30 -D - -H "Origin: https://someone-else.example" "$R/planes?lat=40.6&lng=-73.8" | grep -i -E "^HTTP|^access-control|error"
