name: Release

# On a version tag (v1.2.3), build the engine, run the full test suite, package the sample games into
# self-contained bundles with tools/package.sh, and attach them to a GitHub Release. This is the automated
# equivalent of "build the game, export it, and publish the download".
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      apps:
        description: "Space-separated app targets to package"
        default: "zomboid pong platformer adventure"

permissions:
  contents: write

jobs:
  release:
    name: Build, test, package, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libvulkan-dev glslang-tools mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAZ_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package sample games
        # tools/package.sh assembles a self-contained, redistributable bundle per app under dist/ and
        # verifies it runs from a scratch directory (headless).
        env:
          APPS: ${{ github.event.inputs.apps || 'zomboid pong platformer adventure' }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"   # strip the leading v from the tag for the bundle name
          for app in $APPS; do
            echo "==> Packaging $app $ver"
            tools/package.sh "$app" "$ver" || echo "skip $app (not built)"
          done
          ls -la dist/ || true

      - name: Upload bundles as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maz-bundles-${{ github.ref_name }}
          path: dist/*.tar.gz
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
