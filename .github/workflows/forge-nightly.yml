name: Forge nightly

# The Forge's alarm clock.
#
# The brain lives in `forge/`; this file only wakes it. That separation is
# deliberate (see docs/FORGE.md, "Scheduling") so the schedule can move without
# touching a line of Forge code — which is exactly what happened: the original
# scheduled-session Routine fired three times and produced no run and no
# notification, with no log anyone could read. A workflow run leaves a log.
#
# What happens depends on one thing: whether ANTHROPIC_API_KEY is set.
#
# Without it the night is a DRY RUN — it reads the repo, decides what it
# *would* do, writes one line to the ledger, and stops. With it, the night is
# LIVE: the pick is handed to Crew, the zone's checks must pass, and the result
# is offered as a DRAFT pull request. Nothing is merged, and nothing is ever
# pushed to the trunk either way.
#
# The key is read rather than assumed so a missing secret degrades to the
# quieter night instead of failing every night; the run warns when it does.
#
# Note this file is inside `.github/workflows/`, which `forge/forge/config.py`
# welds into HARD_NO_TOUCH on every config load. The Forge cannot edit its own
# alarm clock, by construction.

on:
  schedule:
    # 08:00 UTC nightly. GitHub's scheduler runs on a best-effort queue and can
    # be late by several minutes under load; nothing here depends on the exact
    # minute.
    - cron: "0 8 * * *"
  # So a human can run it now and read the log, rather than waiting a day to
  # find out whether it works.
  workflow_dispatch:

concurrency:
  group: forge-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nightly:
    name: Sense, decide, record
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The ledger branch is merged with the default branch below, so the
          # full history has to be here.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Forge's dependencies
        # Matches forge/pyproject.toml. The dry run needs no other project's
        # dependencies: it senses and scores, and only a *live* run executes a
        # zone's check commands.
        run: python -m pip install --upgrade pip typer rich

      - name: Work out which branch is which
        id: branches
        # The trunk comes from forge.json, which is the Forge's own
        # declaration of it and the one the Forge itself obeys.
        #
        # This used to ask GitHub for the repository's *default branch*
        # instead, and that was a second source of truth for the same fact.
        # The two agreed only by accident: `main` and the old default,
        # `claude/zomboid-...`, pointed at the same commit. The first merge
        # into `main` moved one and not the other, and from then on the
        # nightly run merged a frozen branch and sensed a repository that no
        # longer existed — silently, and reporting success, because every
        # step did exactly what it was told.
        run: |
          set -euo pipefail
          trunk="$(python -c "import json; print(json.load(open('forge.json'))['base_branch'])")"
          if [ -z "$trunk" ]; then
            echo "::error::forge.json has no base_branch."
            exit 1
          fi
          if ! git ls-remote --exit-code --heads origin "$trunk" >/dev/null 2>&1; then
            echo "::error::forge.json names base_branch '$trunk', which is not a branch on origin."
            exit 1
          fi
          echo "default=$trunk" >> "$GITHUB_OUTPUT"
          echo "Trunk, per forge.json: $trunk"

          # Not a failure — the run is correct either way now — but say so,
          # because the drift is invisible from the Actions tab otherwise.
          ghdefault="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          if [ "$ghdefault" != "$trunk" ]; then
            echo "::warning::GitHub's default branch is '$ghdefault' but the Forge's trunk is '$trunk'. This run used '$trunk'. Fresh clones and new sessions still start on '$ghdefault'."
          fi

      - name: Say who the Forge is, before anything commits
        # Both commits this job can make need an identity: the merge below,
        # when it is a real merge rather than a fast-forward, and the ledger
        # commit near the end. It used to be set only at the ledger commit,
        # which was invisible for as long as the merge was always "Already up
        # to date" — and that was only true while the run was merging a
        # branch that never moved. Fixing the trunk made the merge real and
        # this failed on the very next run.
        #
        # Set once, here, so the two cannot disagree and neither can be
        # reordered out from under it.
        run: |
          set -euo pipefail
          git config user.name "the Forge"
          git config user.email "forge@users.noreply.github.com"

      - name: Put the ledger branch in place
        # Each night appends to the same record rather than overwriting it, so
        # the ledger branch is the base and the default branch is merged into
        # it to pick up any Forge code changes. The ledger file only ever
        # changes on this branch, so that merge does not conflict.
        run: |
          set -euo pipefail
          default="${{ steps.branches.outputs.default }}"
          if git ls-remote --exit-code --heads origin forge/ledger >/dev/null 2>&1; then
            echo "Ledger branch exists; continuing it."
            git fetch origin forge/ledger
            git checkout -B forge-ledger FETCH_HEAD
            git merge --no-edit "origin/$default"
          else
            echo "No ledger branch yet; starting one from $default."
            git checkout -B forge-ledger "origin/$default"
          fi

          # Prove the run is about to sense the trunk as it stands now.
          # Every step of the run that sensed a stale repository reported
          # success, because each did what it was told; nothing asserted the
          # one thing that mattered. This is that assertion, and it is one
          # command: if the trunk's tip is not in this branch's history, the
          # tree below is not the repository anyone is working in.
          if ! git merge-base --is-ancestor "origin/$default" HEAD; then
            echo "::error::forge-ledger does not contain the tip of $default; the run would sense a stale tree."
            exit 1
          fi
          echo "forge-ledger contains $default @ $(git rev-parse --short "origin/$default")"

      - name: Refuse to start on a dirty tree
        # The Forge's own guard, asserted here too: if anything above left the
        # tree dirty, a ledger commit would carry changes that are not the
        # ledger.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean before the run:"
            git status --porcelain
            exit 1
          fi

      - name: Decide whether tonight can be a live run
        id: mode
        # Live needs Crew, and Crew needs a key. Without one the night still
        # happens — it senses, scores and records, exactly as it has been —
        # rather than failing nightly over a missing secret. The warning is
        # there so "nothing is going live" is never silent.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "Live: Crew can be reached."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is not set, so Crew cannot be reached. Recording a dry run instead."
          fi

      - name: Install Crew and the zone's test dependencies
        if: steps.mode.outputs.live == 'true'
        # Only a live run needs these: it hands the job to Crew and then runs
        # the zone's own check commands. A dry run senses and scores, and needs
        # nothing beyond typer and rich.
        run: |
          set -euo pipefail
          python -m pip install -e crew
          python -m pip install "pytest>=8" "httpx>=0.27" "selectolax>=0.3.21" "PyYAML>=6.0"

      - name: Point the trunk at the remote before any branch is cut
        # The night's branch is cut from the trunk *by name*, so the local name
        # has to mean what the remote means. Safe here only because the tree is
        # on the ledger branch: git refuses to force the branch it is standing on.
        run: |
          set -euo pipefail
          trunk="${{ steps.branches.outputs.default }}"
          git branch -f "$trunk" "origin/$trunk"
          echo "$trunk -> $(git rev-parse --short "$trunk")"

      - name: Ask GitHub what happened to earlier pull requests
        # Whether work was merged, and how much a human changed first, is the
        # only evidence in the ledger that a night's work was any good. Green
        # checks only prove nothing broke.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=forge python -m forge.cli followup

      - name: Commit anything followup learned
        # Committed before the run, not after, and that ordering is load-bearing.
        # A live run ends by checking out the trunk, and git refuses to switch
        # branches over an uncommitted file that differs between them — which
        # the ledger always does. Left dirty, the run would fail to return to
        # the trunk and quietly record that in its notes.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- forge/ledger)" ]; then
            git add forge/ledger
            git commit -m "forge: backfill what GitHub said about earlier pull requests"
          else
            echo "Nothing backfilled."
          fi

      - name: Sense, decide, and — if it can — do
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.live }}" = "true" ]; then
            PYTHONPATH=forge python -m forge.cli run --live
          else
            PYTHONPATH=forge python -m forge.cli run --dry-run
          fi

      - name: Capture the ledger the run just wrote
        # A live run does not end where it started. It reads the ledger to
        # score, cuts its branch from the trunk, and on the way out returns the
        # tree to the trunk — so the line it appended is sitting on the *trunk's*
        # copy of the ledger, which on this repo is one line from 10 September.
        # Capture it here, before any branch change, and graft it onto the real
        # one below. A quiet night never leaves the ledger branch, in which case
        # this captures the real ledger and the graft finds nothing to add.
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/captured-ledger"
          rm -rf "$dest"; mkdir -p "$dest"
          cp forge/ledger/*.jsonl "$dest"/ 2>/dev/null || true
          echo "Ended on branch: $(git rev-parse --abbrev-ref HEAD)"
          ls -1 "$dest" 2>/dev/null || echo "(nothing captured)"

      - name: Note anything the run left loose
        # Checked here but NOT failed here. The first live run failed this
        # step, which skipped the recording below and lost the night's ledger
        # line — the one thing every night is supposed to leave behind, thrown
        # away by a canary. So it is noted now, acted on after the record is
        # safe.
        #
        # The Forge's own bookkeeping is excused, and the list comes from the
        # Forge rather than being retyped here: `.claude/codebase-memory.json`
        # is one of those paths, and spelling the list out in YAML is how this
        # step wrongly failed the first time.
        run: |
          set -euo pipefail
          excludes=()
          while IFS= read -r path; do
            [ -n "$path" ] && excludes+=(":(exclude)$path")
          done < <(PYTHONPATH=forge python -c 'from forge.do import FORGE_OWN_PATHS; print(chr(10).join(FORGE_OWN_PATHS))')
          echo "Excusing the Forge's own paths: ${excludes[*]}"
          git status --porcelain -- . "${excludes[@]}" > "$RUNNER_TEMP/loose.txt" || true
          if [ -s "$RUNNER_TEMP/loose.txt" ]; then
            echo "Loose changes found (reported after the ledger is safe):"
            cat "$RUNNER_TEMP/loose.txt"
          else
            echo "Nothing loose."
          fi

      - name: Record the night on the ledger branch
        run: |
          set -euo pipefail
          # The captured copy is the only thing that matters from here, so
          # whatever the run left in this tree can go. Everything, not just the
          # ledger: a modified file that differs between branches would
          # otherwise stop the checkout below.
          git checkout -- . 2>/dev/null || true
          git checkout forge-ledger

          PYTHONPATH=forge python -m forge.cli graft-ledger "$RUNNER_TEMP/captured-ledger"

          if [ -z "$(git status --porcelain -- forge/ledger)" ]; then
            echo "Ledger unchanged — nothing to record."
          else
            git add forge/ledger
            git commit -m "forge: ledger for $(date -u +%Y-%m-%d)"
          fi
          git push origin forge-ledger:refs/heads/forge/ledger

      - name: Fail if the run left anything loose
        # Now that the night is recorded, a stray file is worth failing over.
        # The run's own work belongs on its own branch, reached by a pull
        # request; anything loose in this tree is a bug worth knowing about.
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/loose.txt" ]; then
            echo "::error::The run left changes outside the Forge's own paths:"
            cat "$RUNNER_TEMP/loose.txt"
            exit 1
          fi
          echo "The run left nothing loose."

      - name: Put tonight's line in the run summary
        # So the result is readable from the Actions tab without checking out
        # the ledger branch.
        if: always()
        run: |
          set -euo pipefail
          month="forge/ledger/$(date -u +%Y-%m).jsonl"
          {
            echo "## The Forge — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            if [ -f "$month" ]; then
              echo '```json'
              tail -n 1 "$month" | python -m json.tool
              echo '```'
              echo
              echo "\`outcome: no_task\`, or everything skipped as \`outside_zone\`,"
              echo "is the expected result when nothing has been asked of it —"
              echo "a quiet night is the leash working."
            else
              echo "No ledger file for this month; the run did not get that far."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
