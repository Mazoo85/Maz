name: Deploy Pages

# Publishes the whole repo to GitHub Pages so everything can be reached from a
# phone. The site root is the MAZ ARCADE hub (index.html), which links to every
# project: /zomboid/, /shooter/, /music/ and /madlibs/. Runs when the default
# branch changes, or on demand.

on:
  push:
    branches: ["claude/zomboid-sega-neon-anchorage-i5emkk"]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages for the repo if it isn't already.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the whole repo root: the hub links into each project folder,
          # and each project keeps its own css/ and js/ alongside its index.html.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
