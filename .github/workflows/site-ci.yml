name: Site CI

# Verifies that the repo is actually wired together, which nothing else checks:
# every link in every HTML and Markdown file resolves, the project manifest that
# the hub and the in-app nav both read is intact, and — in a real Chromium — the
# hub lists every project, each app boots clean, and the nav in each app leads
# back to the hub. It also keeps the repository's own inventory honest. A broken
# cross-link is a bug here, not a documentation nit.

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Link & manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependencies — pure Node, so this job is seconds long.
      # The four helpers five projects now share. A mistake in them breaks
      # SCRIPT FORGE, SONG FORGE, CODA PICS and ZOMBOID at once, so they are
      # checked before anything that depends on them.
      - name: Shared helper tests
        run: node shared/tests/maz-util.test.mjs
      - name: Check every local link resolves
        run: node scripts/check-links.mjs
      - name: Check every cross-project dependency is declared
        run: node scripts/check-exchange.mjs
      - name: check-exchange's own tests
        run: node scripts/tests/check-exchange.test.mjs
      - name: check-links's own tests
        run: node scripts/tests/check-links.test.mjs
      # SCRIPT FORGE's reader/writer/exporters are plain modules, so they can be
      # checked here without a browser — seconds, no dependencies.
      - name: SCRIPT FORGE logic tests
        run: node film/tests/film-logic.test.js
      # CODA PICS paints onto a recording canvas, so its whole pipeline —
      # reading the words, painting the scene, finishing it in every style —
      # is checked here without a browser too.
      - name: CODA PICS logic tests
        run: node coda-pics/tests/coda-logic.test.js
      # MADLIBS publishes madlibs/storyideas and SCRIPT FORGE consumes it, so a
      # break in the generator is a break in two projects.
      - name: MADLIBS logic tests
        run: node madlibs/tests/madlibs-logic.test.js
      # The soundtrack surface ZOMBOID consumes. It is loaded by two projects
      # now, so a break in it is a break in both.
      - name: SONG FORGE soundtrack surface
        run: node music/tests/soundtrack.test.js
      # ZOMBOID's map, generator and loot tables run in a vm sandbox with a stub
      # window, so they are checked without a browser; game.js itself is covered
      # by the Chromium smoke test below.
      - name: ZOMBOID logic tests
        run: node zomboid/tests/zomboid-logic.test.js
      # DEAD SECTOR is one self-contained file, so what can be checked without a
      # browser is whether it agrees with itself — every element the script
      # reaches for exists, and it is still single-file. Playing it is below.
      - name: DEAD SECTOR static checks
        run: node shooter/tests/shooter-logic.test.js
      # The inventory catalogues every artifact in the repo and ranks what each
      # one is still missing. It is committed, so it can drift: this fails the
      # build when docs/INVENTORY.md and the repository disagree, which is the
      # only thing that keeps the catalogue worth reading.
      - name: Inventory is up to date
        run: node tools/inventory/main.mjs --check
      - name: The inventory's own tests
        run: node tools/inventory/tests/inventory.test.mjs

  browser:
    name: Site smoke test (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: music/tests
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: music/tests
        run: npx playwright install --with-deps chromium
      - name: Drive the hub and every app
        run: node scripts/smoke-site.cjs
      - name: SCRIPT FORGE end to end (write, export, save)
        run: node film/tests/film-browser.test.js
      - name: CODA PICS end to end (paint, restyle, keep, save)
        run: node coda-pics/tests/coda-browser.test.js
      - name: DEAD SECTOR end to end (play, pause, twin-stick on a phone)
        run: node shooter/tests/shooter-browser.test.js
      # Proves the SONG FORGE soundtrack actually plays in ZOMBOID. A
      # cross-project dependency that loads but does nothing passes every other
      # gate in this file: declared, present, boots clean — and silent.
      - name: ZOMBOID end to end (play, soundtrack, mute)
        run: node zomboid/tests/zomboid-browser.test.js
