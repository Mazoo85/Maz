name: Mandala Maker

# Mandala Maker is a standalone browser app with no build step. Its engine
# (symmetry, generator, save file) is a plain module, so its tests run in
# plain Node in seconds.

on:
  push:
    paths:
      - "mandala/**"
      - ".github/workflows/mandala.yml"
  pull_request:
    paths:
      - "mandala/**"
      - ".github/workflows/mandala.yml"

jobs:
  logic:
    name: Mandala Maker logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the logic tests
        run: node mandala/tests/mandala-logic.test.js
