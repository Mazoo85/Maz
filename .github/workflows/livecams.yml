name: Live Cams

# Live Cams is a standalone browser app with no build step. Its engine (link
# reading, the wall list, the save format) is a plain module, so its tests run
# in plain Node in seconds.

on:
  push:
    paths:
      - "livecams/**"
      - ".github/workflows/livecams.yml"
  pull_request:
    paths:
      - "livecams/**"
      - ".github/workflows/livecams.yml"

jobs:
  logic:
    name: Live Cams logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the logic tests
        run: node livecams/tests/livecams-logic.test.js
