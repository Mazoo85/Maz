name: Earth Explorer

# Earth Explorer is a standalone browser app with no build step. Its maths and
# saved-places file are a plain module, so its tests run in plain Node in
# seconds.

on:
  push:
    paths:
      - "earth/**"
      - ".github/workflows/earth.yml"
  pull_request:
    paths:
      - "earth/**"
      - ".github/workflows/earth.yml"

jobs:
  logic:
    name: Earth Explorer logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the logic tests
        run: node earth/tests/earth-logic.test.js
