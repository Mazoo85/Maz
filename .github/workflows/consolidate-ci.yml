name: Consolidate CI

# Runs the consolidate test suite. Most of it is pure Python and finishes in
# milliseconds; the end-to-end tests create real git repositories in a temp
# folder and merge them, so the job needs git with the subtree command (which
# ubuntu-latest has) but no network and no GitHub token.

on:
  push:
    paths:
      - "consolidate/**"
      - ".github/workflows/consolidate-ci.yml"
  pull_request:
    paths:
      - "consolidate/**"
      - ".github/workflows/consolidate-ci.yml"
  workflow_call:

concurrency:
  group: consolidate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Consolidate tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consolidate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check git has the subtree command
        run: git subtree --help >/dev/null

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest rich typer

      - name: Run tests
        run: pytest -q
