name: Crew CI

# Runs the Maz Crew Python test suite. The crew tests are offline by design (they
# drive the workflow with a fake client and never import the Claude Agent SDK), so
# CI installs only the libraries the tests actually touch plus pytest — no API key
# and no SDK resolution required, which keeps this job fast and reliable.

on:
  push:
    paths:
      - "crew/**"
      - ".github/workflows/crew-ci.yml"
  pull_request:
    paths:
      - "crew/**"
      - ".github/workflows/crew-ci.yml"
  workflow_call:

concurrency:
  group: crew-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Crew tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crew
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest rich typer

      - name: Run tests
        run: pytest -q
