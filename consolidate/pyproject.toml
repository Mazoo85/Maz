[project]
name = "maz-consolidate"
version = "0.1.0"
description = "Fold many repositories into one clean repository, keeping every commit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
consolidate = "consolidate.cli:app"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consolidate"]
