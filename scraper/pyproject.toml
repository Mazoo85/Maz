[project]
name = "maz-scrape"
version = "0.1.0"
description = "A general-purpose, recipe-driven scraper for static HTML pages: crawl, extract with CSS selectors, and write JSONL/CSV/SQLite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "PyYAML>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scrape = "scraper.cli:app"

[tool.pytest.ini_options]
# Put the project root and the tests dir on the path so `pytest` works without
# installing the package (tests import both `scraper.*` and the shared `conftest`).
pythonpath = [".", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
